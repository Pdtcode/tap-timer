<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grail Seekers</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }

/* Grail Seekers in-house banner units.
   Palette lifted from the live site: maroon #621600 / cream #f3ede1 (navbar +
   new-arrivals home), near-black #0c0a09 and neon #f2fffe for the dark cut. */
.gsb {
  --ink: #621600;
  --ground: #f3ede1;
  --hair: rgba(98, 22, 0, 0.28);
  --cta-bg: #621600;
  --cta-ink: #f3ede1;
  --panel: #f3ede1;

  position: relative;
  display: block;
  overflow: hidden;
  box-sizing: border-box;
  background: var(--ground);
  color: var(--ink);
  text-decoration: none;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Inter, Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1;
  isolation: isolate;
}
.gsb.is-dark {
  --ink: #f2fffe;
  --ground: #0c0a09;
  --hair: rgba(242, 255, 254, 0.26);
  --cta-bg: #f2fffe;
  --cta-ink: #0c0a09;
  --panel: #f3ede1;
}
.gsb * { box-sizing: border-box; }

/* Hairline frame — reads as a printed edge rather than a browser border, and
   survives on light and dark publisher backgrounds alike. */
.gsb::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--hair);
  pointer-events: none;
  z-index: 4;
}

.gs-mark { display: block; fill: currentColor; }

/* The product shot ships on a white studio background. multiply drops that
   white into whatever sits behind it, so no cutout/alpha asset is needed —
   on the dark cut the shot rides a cream panel so the black crewneck and the
   blue hoodie both stay readable. */
.gs-shot {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  mix-blend-mode: multiply;
  opacity: 0;
  transition: opacity 650ms ease;
}
.gs-shot.is-on { opacity: 1; }
.gs-shotwrap { position: relative; background: var(--panel); overflow: hidden; }
.gsb.is-dark .gs-shotwrap { border-radius: 2px; }

/* Reduced motion stops the rotation outright rather than merely speeding it up:
   the JS skips its timer and every frame after the first stays hidden. */
@media (prefers-reduced-motion: reduce) {
  .gs-shot { transition: none; }
}

.gs-eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.72;
}
.gs-head {
  font-family: "BIZ UDMincho", "Hiragino Mincho ProN", "Yu Mincho", "Songti SC",
    Georgia, "Times New Roman", serif;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.05;
}
/* balance keeps the two-line sub from dropping a single word onto line two —
   the short copy otherwise leaves "now." stranded on its own. */
.gs-sub { font-size: 11px; font-weight: 450; letter-spacing: 0.01em; opacity: 0.78; line-height: 1.35; text-wrap: balance; }

.gs-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  background: var(--cta-bg);
  color: var(--cta-ink);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 9px 14px;
  white-space: nowrap;
  transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;
}
.gs-cta .gs-arrow { transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1); }
.gsb:hover .gs-cta { opacity: 0.9; }
.gsb:hover .gs-cta .gs-arrow { transform: translateX(3px); }
.gsb:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .gs-cta, .gs-cta .gs-arrow { transition: none; }
}

/* ---- per-size layout ---------------------------------------------------- */

.gsb--970x250 { width: 970px; height: 250px; display: grid; grid-template-columns: 300px 1fr auto; align-items: center; gap: 32px; padding-right: 40px; }
.gsb--970x250 .gs-shotwrap { width: 300px; height: 250px; }
.gsb--970x250 .gs-mark { width: 46px; margin-bottom: 16px; }
.gsb--970x250 .gs-head { font-size: 44px; }
.gsb--970x250 .gs-sub { margin-top: 14px; max-width: 34ch; }
.gsb--970x250 .gs-cta { font-size: 11px; padding: 13px 22px; }

.gsb--728x90 { width: 728px; height: 90px; display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 24px; padding-right: 20px; }
.gsb--728x90 .gs-shotwrap { width: 90px; height: 90px; }
.gsb--728x90 .gs-head { font-size: 21px; }
.gsb--728x90 .gs-sub { display: none; }
.gsb--728x90 .gs-eyebrow { font-size: 8px; margin-bottom: 7px; }

/* The other units crop a square shot to a near-square slot, which costs nothing.
   This one's slot is far wider than it is tall, so `cover` would slice the top
   and bottom off the garment — it gets a taller area and `contain` instead, and
   the letterboxing is invisible because the panel is the same cream as the
   ground. Type steps down to buy back the height. */
.gsb--300x250 { width: 300px; height: 250px; display: flex; flex-direction: column; }
.gsb--300x250 .gs-shotwrap { width: 300px; height: 156px; flex: none; }
.gsb--300x250 .gs-shot { object-fit: contain; padding: 10px 10px 4px; }
.gsb--300x250 .gs-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 18px; }
.gsb--300x250 .gs-head { font-size: 18px; margin-top: 2px; }
.gsb--300x250 .gs-eyebrow { margin-bottom: 5px; }
.gsb--300x250 .gs-cta { align-self: flex-start; margin-top: 11px; padding: 8px 13px; }

.gsb--300x600 { width: 300px; height: 600px; display: flex; flex-direction: column; }
.gsb--300x600 .gs-shotwrap { width: 300px; height: 300px; flex: none; }
.gsb--300x600 .gs-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 26px; }
.gsb--300x600 .gs-mark { width: 38px; margin-bottom: 22px; }
.gsb--300x600 .gs-head { font-size: 32px; }
.gsb--300x600 .gs-sub { margin-top: 16px; }
.gsb--300x600 .gs-cta { align-self: flex-start; margin-top: 24px; padding: 12px 20px; }

/* At 50px tall a cover-cropped product shot is unreadable mush, so the mobile
   strip carries the monogram as a solid brand bug instead. */
.gsb--320x50 { width: 320px; height: 50px; display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 12px; padding-right: 8px; }
.gsb--320x50 .gs-bug { width: 50px; height: 50px; display: grid; place-items: center; background: var(--cta-bg); color: var(--cta-ink); }
.gsb--320x50 .gs-bug .gs-mark { width: 26px; }
/* nowrap is load-bearing: a second line of 12px type inside 50px of height has
   nowhere to go, so the tagline holds one line and the size gives way instead. */
.gsb--320x50 .gs-head { font-size: 12px; letter-spacing: 0.03em; white-space: nowrap; }
.gsb--320x50 .gs-eyebrow, .gsb--320x50 .gs-sub { display: none; }
.gsb--320x50 .gs-cta { font-size: 8px; padding: 7px 10px; letter-spacing: 0.12em; }

</style>
</head>

    '<span class="gs-cta">' + (tiny ? GS_COPY.ctaShort : GS_COPY.cta) +

  var inner;
  if (stacked) {
    inner = shot + '<div class="gs-body">' + mark + eyebrow + headline +
      (size === "300x600" ? sub : "") + cta + "</div>";
  } else if (strip) {
    inner = shot + "<div>" + eyebrow + headline + "</div>" + cta;
  } else if (tiny) {
    inner = '<div class="gs-bug">' + GS_LOGO + "</div><div>" + headline +
      "</div>" + cta;
  } else {
    inner = shot + "<div>" + mark + eyebrow + headline + sub + "</div>" + cta;
  }

  var a = document.createElement("a");
  a.className = "gsb gsb--" + size + (theme === "dark" ? " is-dark" : "");
  a.href = GS_HREF + size;
  a.target = "_blank";
  a.rel = "noopener";
  // Screen readers get one coherent label instead of the shredded inner spans.
  a.setAttribute(
    "aria-label",
    "Grail Seekers — limited-edition streetwear drops. Shop the drop."
  );
  a.innerHTML = inner;
  gsRotate(a);
  return a;
}

/* Crossfades the product frames. Two gates keep an ad banner from being a
   background CPU drain: nothing ticks while the unit is scrolled out of view
   (IntersectionObserver), and nothing ticks while the tab is hidden. Readers
   who asked for reduced motion get the first frame and no timer at all. */
function gsRotate(root) {
  var frames = root.querySelectorAll(".gs-shot");
  if (frames.length < 2) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var i = 0;
  var timer = null;

  function advance() {
    frames[i].classList.remove("is-on");
    i = (i + 1) % frames.length;
    frames[i].classList.add("is-on");
  }
  function start() {
    if (timer === null) timer = setInterval(advance, GS_ROTATE_MS);
  }
  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  var onScreen = true;
  function sync() {
    if (onScreen && !document.hidden) start();
    else stop();
  }

  document.addEventListener("visibilitychange", sync);

  // Start rotating immediately and let the observer PAUSE it, rather than
  // waiting for a first callback to start it. Fail-open matters here: if the
  // observer is slow to report, unsupported, or silent (some embedded and
  // headless engines never fire it), a fail-closed banner would sit frozen on
  // frame one forever, which is worse than a banner that animates off-screen.
  sync();

  if (typeof IntersectionObserver === "function") {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }, { threshold: 0.15 }).observe(root);
  }
}

// ?size=970x250|728x90|300x250|300x600|320x50  &theme=cream|dark
var q = new URLSearchParams(location.search);
var size = q.get("size") || "300x250";
document.body.appendChild(gsBanner(size, q.get("theme") || "cream"));
</script>
