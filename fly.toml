# fly.toml app configuration file generated for tap-timer on 2026-10-01T21:13:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tap-timer'
primary_region = 'dfw'

[build]

[env]
  APP_ENV = 'production'
  PORT = '8080'
  BASE_URL = 'https://tap-timer.fly.dev' # change to https://tap-timer.com once the domain is set up
  APP_STORE_ID = '6802904982'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
