# fly.toml app configuration file generated for tap-timer on 2026-10-01T21:13:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tap-timer'
primary_region = 'dfw'

[build]

[env]
  APP_ENV = 'production'
  PORT = '8080'
  BASE_URL = 'https://tap-timer.com'
  APP_STORE_ID = '6802904982'
  # Public publisher ID: adds the AdSense script and meta tag to every page and serves /ads.txt.
  # Ad units stay empty until ADSENSE_SLOT_SIDEBAR / _INCONTENT / _FOOTER are set (after approval).
  ADSENSE_CLIENT = 'ca-pub-6274927128191860'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  # Without this, Fly caps a machine at about 20-25 connections. Every Online
  # multiplayer player holds a WebSocket open for the whole match, so count
  # connections and allow ~1,000 (fits the 256 MB VM; see flyio-setup.md).
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
